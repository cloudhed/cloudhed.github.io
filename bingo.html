<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NornanBINGO!</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito+Sans:wght@600;800&display=swap');

  :root {
    --bg: #f0ece4;
    --card: #fffdf9;
    --accent: #264653;
    --text: #2b2d42;
    --text-light: #8d99ae;
    --border: #ddd5c8;
    --skoj: #e9a13b;
    --skoj-light: #fdf0d9;
    --rorelse: #2a9d8f;
    --rorelse-light: #d9f1ee;
    --skapa: #b5577e;
    --skapa-light: #f8e2ec;
    --danger: #c0392b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }
  body {
    font-family: 'Nunito Sans', ui-sans-serif, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- Topprad ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 1.2vh 2vw;
  }
  h1 {
    font-family: 'Baloo 2', cursive;
    font-weight: 800;
    font-size: clamp(2rem, 6vh, 4.5rem);
    line-height: 1;
    color: var(--accent);
  }
  .tools { display: flex; gap: 8px; opacity: 0.45; transition: opacity 0.2s; }
  .tools:hover, .tools:focus-within { opacity: 1; }
  .tools button {
    font: 700 0.85rem 'Nunito Sans', sans-serif;
    background: var(--card);
    color: var(--accent);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    cursor: pointer;
  }
  .tools button:hover { border-color: var(--accent); }

  /* ---------- Tre aktivitetsfält ---------- */
  .zones {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.5vw;
    padding: 0 2vw;
  }
  .zone {
    --c: var(--accent);
    --c-light: var(--card);
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--c-light);
    border: 0.5vh solid var(--c);
    border-radius: 24px;
    overflow: hidden;
    transition: transform 0.12s, box-shadow 0.12s;
  }
  .zone[data-zone="skoj"]     { --c: var(--skoj);    --c-light: var(--skoj-light); }
  .zone[data-zone="rorelsen"] { --c: var(--rorelse); --c-light: var(--rorelse-light); }
  .zone[data-zone="skapa"]    { --c: var(--skapa);   --c-light: var(--skapa-light); }
  .zone.over {
    transform: scale(1.02);
    box-shadow: 0 0 0 1vh var(--c), 0 12px 32px rgba(0,0,0,0.18);
  }
  .zone-title {
    background: var(--c);
    color: #fff;
    text-align: center;
    font-family: 'Baloo 2', cursive;
    font-weight: 800;
    font-size: clamp(1.6rem, 5vh, 3.6rem);
    line-height: 1.1;
    padding: 1.2vh 8px;
  }
  .zone-title .emoji { margin-right: 0.3em; }
  .zone-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
    gap: 1.2vh 0.8vw;
    padding: 2vh 1vw;
  }
  .hint {
    margin: auto;
    color: var(--c);
    opacity: 0.45;
    font-family: 'Baloo 2', cursive;
    font-size: clamp(1.2rem, 3vh, 2.2rem);
    text-align: center;
    pointer-events: none;
  }

  /* ---------- Namnbrickor ---------- */
  .chip {
    font-family: 'Baloo 2', cursive;
    font-weight: 700;
    font-size: clamp(1.1rem, 3.4vh, 2.4rem);
    line-height: 1;
    white-space: nowrap;
    background: #fff;
    color: var(--accent);
    border: 3px solid var(--accent);
    border-radius: 999px;
    padding: 0.5em 0.9em;
    box-shadow: 0 3px 0 rgba(0,0,0,0.18);
    cursor: grab;
    touch-action: none;
  }
  .zone .chip { border-color: var(--c); color: var(--c); }
  .chip.dragging { opacity: 0.25; }
  .chip.ghost {
    position: fixed;
    z-index: 100;
    pointer-events: none;
    cursor: grabbing;
    transform: translate(-50%, -50%) scale(1.12) rotate(-3deg);
    box-shadow: 0 14px 28px rgba(0,0,0,0.3);
  }

  /* ---------- Namnbricke-lådan längst ner ---------- */
  .tray {
    margin: 1.5vh 2vw 1.5vh;
    background: var(--card);
    border: 2px dashed var(--border);
    border-radius: 20px;
    padding: 1.2vh 1vw;
    display: flex;
    flex-direction: column;
    gap: 1vh;
    max-height: 32vh;
    transition: border-color 0.12s, background 0.12s;
  }
  .tray.over { border-color: var(--accent); background: #fff; }
  .tray-bar { display: flex; align-items: center; gap: 12px; }
  .tray-label {
    font-family: 'Baloo 2', cursive;
    font-weight: 700;
    color: var(--text-light);
    font-size: 1.1rem;
    white-space: nowrap;
  }
  form { display: flex; gap: 8px; margin-left: auto; }
  input[type="text"] {
    font: 800 1.05rem 'Nunito Sans', sans-serif;
    color: var(--text);
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 9px 12px;
    width: min(38vw, 260px);
    background: #fff;
    user-select: text;
    -webkit-user-select: text;
  }
  input[type="text"]:focus { outline: none; border-color: var(--accent); }
  form button {
    font: 800 1.05rem 'Nunito Sans', sans-serif;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 9px 18px;
    cursor: pointer;
  }
  .tray-body {
    display: flex;
    flex-wrap: wrap;
    gap: 1vh 0.8vw;
    overflow-y: auto;
    min-height: 3.2em;
  }

  /* ---------- Papperskorg (visas bara vid dragning) ---------- */
  .trash {
    position: fixed;
    right: 2vw;
    top: 1.2vh;
    z-index: 50;
    display: none;
    align-items: center;
    gap: 8px;
    font: 800 1.1rem 'Nunito Sans', sans-serif;
    color: var(--danger);
    background: #fff;
    border: 3px dashed var(--danger);
    border-radius: 16px;
    padding: 1.4vh 1.6vw;
  }
  body.is-dragging .trash { display: flex; }
  .trash.over { background: var(--danger); color: #fff; border-style: solid; }

  /* ---------- BINGO!-animation ---------- */
  .btn-bingo {
    font: 800 clamp(1rem, 2.6vh, 1.6rem) 'Baloo 2', cursive;
    background: var(--skoj);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 0.4em 1.2em;
    box-shadow: 0 4px 0 rgba(0,0,0,0.2);
    cursor: pointer;
  }
  .btn-bingo:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.2); }
  .header-right { display: flex; align-items: center; gap: 16px; }

  .bingo-overlay {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(38, 70, 83, 0.88);
    cursor: pointer;
  }
  .bingo-overlay.show { display: flex; }
  .bingo-letters {
    display: flex;
    gap: 1.5vw;
    font-family: 'Baloo 2', cursive;
    font-weight: 800;
    font-size: min(22vw, 46vh);
    line-height: 1;
  }
  .bingo-letters span {
    display: inline-block;
    opacity: 0;
    color: var(--c);
    text-shadow: 0 0.04em 0 rgba(0,0,0,0.25);
  }
  .bingo-overlay.show .bingo-letters span {
    /* --i = bokstavens nummer; varje bokstav startar lite efter den förra */
    animation: bingo-pop 0.7s cubic-bezier(0.2, 0.9, 0.3, 1.4) forwards;
    animation-delay: calc(var(--i) * 150ms);
  }
  @keyframes bingo-pop {
    0%   { opacity: 0; transform: scale(0) rotate(-20deg); }
    60%  { opacity: 1; transform: scale(1.35) rotate(6deg); }
    100% { opacity: 1; transform: scale(1) rotate(0); }
  }
</style>
</head>
<body>

<header>
  <h1>NornanBINGO! 🎉</h1>
  <div class="header-right">
    <button type="button" class="btn-bingo" id="btn-bingo">BINGO! 🎉</button>
    <div class="tools">
      <button type="button" id="btn-reset">Töm fälten</button>
      <button type="button" id="btn-full">Helskärm</button>
    </div>
  </div>
</header>

<main class="zones">
  <section class="zone" data-zone="skoj">
    <div class="zone-title"><span class="emoji">🌳</span>Nornanskoj</div>
    <div class="zone-body"></div>
  </section>
  <section class="zone" data-zone="rorelsen">
    <div class="zone-title"><span class="emoji">🏃</span>Rörelsen</div>
    <div class="zone-body"></div>
  </section>
  <section class="zone" data-zone="skapa">
    <div class="zone-title"><span class="emoji">🎨</span>Skaparverkstad</div>
    <div class="zone-body"></div>
  </section>
</main>

<section class="tray" data-zone="tray">
  <div class="tray-bar">
    <span class="tray-label">Vinnare – dra namnet till rätt fält ☝️</span>
    <form id="add-form" autocomplete="off">
      <input type="text" id="add-name" placeholder="Nytt namn…" maxlength="30" aria-label="Nytt namn">
      <button type="submit">Lägg till</button>
    </form>
  </div>
  <div class="tray-body"></div>
</section>

<div class="bingo-overlay" id="bingo-overlay" aria-hidden="true">
  <div class="bingo-letters">
    <span style="--i:0; --c:#e9a13b">B</span>
    <span style="--i:1; --c:#2a9d8f">I</span>
    <span style="--i:2; --c:#ff7b7b">N</span>
    <span style="--i:3; --c:#b5577e">G</span>
    <span style="--i:4; --c:#f4e04d">O</span>
    <span style="--i:5; --c:#fff">!</span>
  </div>
</div>

<div class="trash" id="trash">🗑️ Släpp här för att ta bort</div>

<script>
(function () {
  'use strict';

  const STORAGE_KEY = 'nornanbingo-v1';
  const ZONES = ['skoj', 'rorelsen', 'skapa', 'tray'];

  // Varje bricka: { id, name, zone }. Ordningen i listan = ordningen på skärmen.
  let chips = load();
  let nextId = chips.reduce((m, c) => Math.max(m, c.id), 0) + 1;

  const zoneEls = {};
  document.querySelectorAll('[data-zone]').forEach(el => {
    zoneEls[el.dataset.zone] = el;
  });
  const trashEl = document.getElementById('trash');

  // ---------- Sparande ----------
  function load() {
    try {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (Array.isArray(data)) {
        return data.filter(c => c && typeof c.name === 'string' && ZONES.includes(c.zone));
      }
    } catch (e) { /* ingen sparad data – börja om */ }
    return [];
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(chips)); } catch (e) { /* ignoreras */ }
  }

  // ---------- Rita ----------
  function render() {
    ZONES.forEach(zone => {
      const body = zoneEls[zone].querySelector(zone === 'tray' ? '.tray-body' : '.zone-body');
      body.replaceChildren();
      const inZone = chips.filter(c => c.zone === zone);
      inZone.forEach(c => body.appendChild(makeChip(c)));
      if (zone !== 'tray' && inZone.length === 0) {
        const hint = document.createElement('div');
        hint.className = 'hint';
        hint.textContent = 'Dra hit ✨';
        body.appendChild(hint);
      }
    });
  }

  function makeChip(c) {
    const el = document.createElement('div');
    el.className = 'chip';
    el.dataset.id = c.id;
    el.textContent = c.name;
    el.addEventListener('pointerdown', e => startDrag(e, c, el));
    return el;
  }

  // ---------- Lägg till ----------
  document.getElementById('add-form').addEventListener('submit', e => {
    e.preventDefault();
    const input = document.getElementById('add-name');
    const name = input.value.trim();
    if (!name) return;
    chips.push({ id: nextId++, name, zone: 'tray' });
    input.value = '';
    save();
    render();
    input.focus();
  });

  // ---------- Dra och släpp (pekskärm + mus) ----------
  let drag = null;

  function startDrag(e, chip, el) {
    if (e.button !== undefined && e.button !== 0) return;
    e.preventDefault();
    const ghost = el.cloneNode(true);
    ghost.classList.add('ghost');
    document.body.appendChild(ghost);
    el.classList.add('dragging');
    document.body.classList.add('is-dragging');
    drag = { chip, el, ghost, pointerId: e.pointerId, target: null };
    moveDrag(e);
    window.addEventListener('pointermove', moveDrag);
    window.addEventListener('pointerup', endDrag);
    window.addEventListener('pointercancel', cancelDrag);
  }

  function targetAt(x, y) {
    const hit = document.elementFromPoint(x, y);
    if (!hit) return null;
    if (hit.closest('#trash')) return 'trash';
    const z = hit.closest('[data-zone]');
    return z ? z.dataset.zone : null;
  }

  function moveDrag(e) {
    if (!drag || e.pointerId !== drag.pointerId) return;
    drag.ghost.style.left = e.clientX + 'px';
    drag.ghost.style.top = e.clientY + 'px';
    drag.target = targetAt(e.clientX, e.clientY);
    Object.entries(zoneEls).forEach(([name, el]) => el.classList.toggle('over', name === drag.target));
    trashEl.classList.toggle('over', drag.target === 'trash');
  }

  function finishDrag() {
    window.removeEventListener('pointermove', moveDrag);
    window.removeEventListener('pointerup', endDrag);
    window.removeEventListener('pointercancel', cancelDrag);
    drag.ghost.remove();
    document.body.classList.remove('is-dragging');
    Object.values(zoneEls).forEach(el => el.classList.remove('over'));
    trashEl.classList.remove('over');
  }

  function endDrag(e) {
    if (!drag || e.pointerId !== drag.pointerId) return;
    const { chip, target } = drag;
    finishDrag();
    drag = null;
    if (target === 'trash') {
      chips = chips.filter(c => c !== chip);
    } else if (target && target !== chip.zone) {
      // Flytta sist i det nya fältet så att senaste vinnaren hamnar längst bak.
      chips = chips.filter(c => c !== chip);
      chip.zone = target;
      chips.push(chip);
    }
    save();
    render();
  }

  function cancelDrag() {
    if (!drag) return;
    finishDrag();
    drag = null;
    render();
  }

  // ---------- Verktyg ----------
  document.getElementById('btn-reset').addEventListener('click', () => {
    if (!confirm('Flytta tillbaka alla namn till vinnarlådan?')) return;
    chips.forEach(c => { c.zone = 'tray'; });
    save();
    render();
  });

  document.getElementById('btn-full').addEventListener('click', () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  });

  // ---------- BINGO!-animation ----------
  const bingoOverlay = document.getElementById('bingo-overlay');
  const BINGO_VISIBLE_MS = 4500;
  let bingoTimer = null;

  function hideBingo() {
    clearTimeout(bingoTimer);
    bingoOverlay.classList.remove('show');
  }
  function showBingo() {
    hideBingo();
    void bingoOverlay.offsetWidth; // startar om animationen om man trycker igen
    bingoOverlay.classList.add('show');
    bingoTimer = setTimeout(hideBingo, BINGO_VISIBLE_MS);
  }
  document.getElementById('btn-bingo').addEventListener('click', showBingo);
  bingoOverlay.addEventListener('click', hideBingo);

  render();
})();
</script>
</body>
</html>
