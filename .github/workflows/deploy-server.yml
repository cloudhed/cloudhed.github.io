# Deploys the game server (Cloudflare Worker + Durable Object).
#
# The client half of this project deploys itself: GitHub Pages serves the repo
# on push. The server is a separate system and needs this.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   an "Edit Cloudflare Workers" token
#   CLOUDFLARE_ACCOUNT_ID  from the Workers & Pages page in the dashboard
name: Deploy server

on:
  push:
    branches: [main]
    # shared/ matters too: wrangler bundles those modules into the worker, so a
    # change to the simulation is a server change even though it lives outside
    # server/.
    paths:
      - 'server/**'
      - 'shared/**'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run simulation tests
        run: node --test "tests/*.test.js"

      - name: Deploy worker
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy 2>&1 | tee deploy.log

      - name: Report the server URL
        working-directory: server
        run: |
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$URL" ]; then
            echo "Could not find a workers.dev URL in the deploy output." >&2
            exit 1
          fi
          echo "Deployed to $URL"
          echo "Health check:"
          curl -sS --fail "$URL/health" && echo
          {
            echo "### Server deployed"
            echo ""
            echo "\`$URL\`"
            echo ""
            echo "Set \`SERVER_HOST\` in \`game/src/config.js\` to \`${URL#https://}\`"
            echo "if it is not already."
          } >> "$GITHUB_STEP_SUMMARY"
